# Prometheus: pull model, scrape interval ~5s (requirements.md раздел 13).
# Grafana/Pushgateway запрещены требованиями и не настраиваются.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    stand: streaming-polling-outbox

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: etcd
    static_configs:
      - targets:
          - etcd1:2379
          - etcd2:2379
          - etcd3:2379

  - job_name: writer
    static_configs:
      - targets: ['writer:8080']

  # Этап 4: CDC Polling (target поднимается вместе с сервисом --profile polling)
  - job_name: cdc-polling
    static_configs:
      - targets: ['cdc-polling:8080']

  # Этап 5: CDC Streaming (target поднимается вместе с сервисом --profile streaming;
  # профили polling/streaming никогда не работают на одном слоте одновременно)
  - job_name: cdc-streaming
    static_configs:
      - targets: ['cdc-streaming:8080']

  # Этап 6, requirements.md 13.3 — метрики инфраструктуры.
  # Patroni /metrics не скрапим: требует basic-auth в этом файле, а конфиг
  # bind-mounted из репозитория и не темплейтится env'ом (hardcoded secrets
  # запрещены, requirements.md 23); состояние кластера HA-скрипты этапа 8
  # берут напрямую из Patroni REST API. Подробности — docs/deviations.md 7.

  # PostgreSQL: replication lag, logical slot state, WAL retention
  # (кастомные запросы — postgres-exporter-queries.yaml рядом с этим файлом)
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Kafka: доступность брокеров, offsets топиков, consumer lag (с этапа 7)
  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']

  # CPU/RAM контейнеров (сравнение A/B, requirements.md 16)
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

