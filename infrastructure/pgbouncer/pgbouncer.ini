; PgBouncer: transaction pooling на актуальный primary через HAProxy.
; requirements.md раздел 3.3: pool_mode=transaction, переживает failover
; (server_login_retry + on-marked-down shutdown-sessions у HAProxy рвут
; соединения к упавшему primary и пересоздают их на новый).

[databases]
; Единственная прикладная БД стенда — postgres (см. 01-db-publication.sql:
; PG17 slotsync worker синхронизирует слоты только БД из primary_conninfo).
postgres = host=haproxy port=5432 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; userlist.txt генерируется init-db сервисом из pg_authid (SCRAM-верификаторы)
; и монтируется через volume — пароли в исходном коде не хранятся.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer-auth/userlist.txt

pool_mode = transaction
max_client_conn = 300
default_pool_size = 20

; Устойчивость к смене primary (значения в секундах — PgBouncer ожидает int)
server_login_retry = 1
server_connect_timeout = 5
server_check_query = select 1
server_check_delay = 5
query_wait_timeout = 120

admin_users = postgres
stats_users = postgres
ignore_startup_parameters = extra_float_digits

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
