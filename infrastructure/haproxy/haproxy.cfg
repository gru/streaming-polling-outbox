# Маршрутизация соединений на актуальный primary Patroni-кластера.
# Проверка здоровья — HTTP-эндпоинты Patroni REST API (порт 8008):
# /primary возвращает 200 только на leader.

global
  log stdout format raw local0 info
  maxconn 1000

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 60m
  timeout server 60m

frontend stats
  bind *:8404
  mode http
  stats enable
  stats uri /stats

frontend postgres_primary
  bind *:5432
  default_backend postgres_primary

backend postgres_primary
  option httpchk
  http-check connect port 8008
  http-check send meth GET uri /primary ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
  server pg1 pg1:5432 check port 8008
  server pg2 pg2:5432 check port 8008
  server pg3 pg3:5432 check port 8008
