# Маршрутизация соединений на актуальный primary Patroni-кластера.
# Проверка здоровья — HTTP-эндпоинты Patroni REST API (порт 8008):
# /primary возвращает 200 только на leader.
#
# ГРАБЛИ этапа 8 (deviations 9о): без секции resolvers haproxy резолвит имена
# pg-нод ОДИН раз при старте; перезапуски pg-контейнеров (kill/start в
# fault-тестах) меняют их IP в docker-сети — haproxy продолжал чекать старые
# адреса (Layer4 timeout на всех бекендах, соединения к primary обрывались).
# Динамический ре-резолв через встроенный Docker DNS это лечит.

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold other 10s
  hold refused 10s
  hold nx 10s
  hold timeout 10s
  hold valid 10s

global
  log stdout format raw local0 info
  maxconn 1000

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 60m
  timeout server 60m

frontend stats
  bind *:8404
  mode http
  stats enable
  stats uri /stats

frontend postgres_primary
  bind *:5432
  default_backend postgres_primary

backend postgres_primary
  option httpchk
  http-check connect port 8008
  http-check send meth GET uri /primary ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr last,libc,none
  server pg1 pg1:5432 check port 8008
  server pg2 pg2:5432 check port 8008
  server pg3 pg3:5432 check port 8008
